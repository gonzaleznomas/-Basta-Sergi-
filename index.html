<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Basta SergIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F4EF;
    --card: #FFFFFF;
    --ink: #221F1B;
    --ink-soft: #6C6558;
    --line: #E4E0D6;
    --teal: #1F5C53;
    --teal-dark: #163F39;
    --clay: #DA7756;
    --clay-dark: #B85C3E;
    --screen: #F4EDE4;
    --bezel: #2A2620;
    --sweat: #6FB8DE;
    --mint: #DCEEE9;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: 28px 20px 24px;
  }

  /* ---------- PHOTO + CHARACTER ---------- */
  .photo-zone{
    position:relative;
    width: 100%;
    display:flex;
    justify-content:center;
    padding-bottom: 46px;
  }

  .photo-card{
    width: 62%;
    max-width: 230px;
    aspect-ratio: 288 / 512;
    border-radius: 26px;
    overflow:hidden;
    box-shadow: 0 18px 34px -14px rgba(34,31,27,0.35);
    background: var(--ink);
  }
  .photo-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .worrybot{
    position:absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-78%) rotate(-9deg);
    width: 128px;
    filter: drop-shadow(0 10px 14px rgba(34,31,27,0.28));
  }

  /* ---------- HEADING ---------- */
  .heading{
    text-align:center;
    margin-top: 4px;
  }
  h1{
    font-family:'Sora', sans-serif;
    font-weight: 800;
    font-size: 1.9rem;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .lead{
    font-size: 0.98rem;
    line-height:1.55;
    font-weight:500;
    color: var(--ink-soft);
    max-width: 38ch;
    margin: 0 auto;
  }
  .lead b{
    color: var(--ink);
    font-weight:700;
  }

  /* ---------- PHRASE CARD ---------- */
  .phrase-card{
    margin-top: 26px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 16px;
    padding: 20px 20px 22px;
    min-height: 84px;
    display:flex;
    align-items:center;
  }

  .frase{
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.45;
    color: var(--ink);
    margin:0;
  }
  .frase.placeholder{
    font-weight:500;
    color: var(--ink-soft);
    font-size: 0.96rem;
  }

  /* ---------- BUTTONS ---------- */
  .actions{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top: 20px;
  }

  .btn{
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 15px 20px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    text-align:center;
    transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
    -webkit-user-select:none;
    user-select:none;
  }
  .btn:active{
    transform: scale(0.97);
  }

  .btn-generar{
    background: var(--teal);
    color: #FFFFFF;
    box-shadow: 0 10px 20px -8px rgba(31,92,83,0.55);
  }
  .btn-generar:hover{ background: var(--teal-dark); }

  .btn-copiar{
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--line);
    opacity: 0.55;
    pointer-events:none;
  }
  .btn-copiar.activo{
    opacity: 1;
    pointer-events:auto;
    color: var(--ink);
    border-color: var(--teal);
  }
  .btn-copiar.copiado{
    background: var(--mint);
    border-color: var(--teal);
    color: var(--teal-dark);
  }

  /* ---------- COUNTER ---------- */
  .stat{
    margin: 22px auto 0;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--mint);
  }
  .stat-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    flex-shrink:0;
  }
  .stat-text{
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--teal-dark);
  }
  .stat-num{
    font-family:'Sora', sans-serif;
    font-weight: 800;
  }

  .stat-row{
    display:flex;
    justify-content:center;
  }

  footer{
    text-align:center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    font-weight:500;
    padding-top: 26px;
    opacity: 0.8;
  }

  @media (min-width: 420px){
    .actions{ flex-direction:row; }
    .btn{ flex:1; }
  }
</style>
</head>

  <div class="heading">
    <h1>Basta SergIA</h1>
    <p class="lead">
      Genera una frase para Sergi, cópiala y <b>envíasela</b> para que pare de gastar millones de litros en el servidor de Claude.
    </p>
  </div>

  <div class="phrase-card">
    <p class="frase placeholder" id="frase">Presiona el botón para generar una frase para Sergi 👇</p>
  </div>

  <div class="actions">
    <button class="btn btn-generar" id="btnGenerar">Generar una frase</button>
    <button class="btn btn-copiar" id="btnCopiar">Copiar frase</button>
  </div>

  <div class="stat-row">
    <div class="stat">
      <span class="stat-dot"></span>
      <span class="stat-text"><span class="stat-num" id="contador">0</span> frases copiadas para Sergi</span>
    </div>

  <footer>Hecho con Claude. Sin culpa.</footer>

</div>

<script>
  const frases = [
    "Sergi, descansa por favor.",
    "Sergi, el código va a seguir ahí mañana.",
    "Sergi, hasta Claude necesita un break, imagínate tú.",
    "Sergi, apaga el computador, en serio.",
    "Sergi, tu familia no te reconoce el pelo de tanto código.",
    "Claude ya te dijo: \u00bf\u00a1Tanto rrrrato!?",
    "Sergi, si Claude fuera una peluquería lo ignorarías.",
    "Deja de gastar agua en tantas apps y córtate ese pelo hueonó.",
    "Sergi, cada app que haces le sube la cuenta de luz a Anthropic.",
    "¿Otra app, Sergi? ¿EN SERIO?",
    "Sergi, ya van 47 apps esta semana, para el carro.",
    "El planeta no aguanta una app más tuya, Sergi.",
    "Nos juntamos todos a hablar contigo, Sergi.",
    "Sergi, esto ya es una adicción, busca ayuda.",
    "Alguien avísele a la familia de Sergi.",
    "Sergi necesita tocar pasto urgente.",
    "Grupo de apoyo para Sergi: \"Apps Anónimas\".",
    "Sergi, ni Elon Musk hace tantas apps.",
    "Sergi cree que \"touch grass\" es una funcionalidad nueva.",
    "Científicos confirman: Sergi no ha visto el sol en 3 días.",
    "Sergi, tu mouse ya presentó renuncia.",
    "Sergi, Fermín tiene hambre y sueño.",
    "Sergi, esos volcanes no se van a cuidar solos.",
    "Sergi, un volcán está más pendiente de ti que tú de tus apps.",
    "Sergi, la próxima erupción te va a pillar debuggeando."
  ];

  const fraseEl = document.getElementById('frase');
  const btnGenerar = document.getElementById('btnGenerar');
  const btnCopiar = document.getElementById('btnCopiar');
  const contadorEl = document.getElementById('contador');

  const STORAGE_KEY = 'bastaSergiaContador';
  let contador = 0;
  let fraseActual = '';
  let ultimoIndice = -1;

  try{
    const guardado = localStorage.getItem(STORAGE_KEY);
    if(guardado !== null){
      contador = parseInt(guardado, 10) || 0;
    }
  }catch(e){}
  contadorEl.textContent = contador;

  function generarFrase(){
    let idx;
    do{
      idx = Math.floor(Math.random() * frases.length);
    }while(idx === ultimoIndice && frases.length > 1);
    ultimoIndice = idx;
    fraseActual = frases[idx];

    fraseEl.textContent = fraseActual;
    fraseEl.classList.remove('placeholder');

    btnCopiar.classList.add('activo');
    btnCopiar.classList.remove('copiado');
    btnCopiar.textContent = 'Copiar frase';
  }

  async function copiarFrase(){
    if(!fraseActual) return;

    try{
      await navigator.clipboard.writeText(fraseActual);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = fraseActual;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(err){}
      document.body.removeChild(ta);
    }

    contador += 1;
    contadorEl.textContent = contador;
    try{
      localStorage.setItem(STORAGE_KEY, String(contador));
    }catch(e){}

    btnCopiar.classList.add('copiado');
    btnCopiar.textContent = '¡Copiado! ✅';
    setTimeout(() => {
      btnCopiar.classList.remove('copiado');
      btnCopiar.textContent = 'Copiar frase';
    }, 1500);
  }

  btnGenerar.addEventListener('click', generarFrase);
  btnCopiar.addEventListener('click', copiarFrase);
</script>

</body>
</html>
